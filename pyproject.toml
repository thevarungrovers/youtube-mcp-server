[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-mcp-server"
version = "0.1.0"
description = "Read-only YouTube Data & Analytics API wrapper, CLI, and MCP server for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "google-api-python-client>=2.150",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    "mcp>=2.3,<3",
    "click>=8.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
youtube-mcp = "mcp_server.server:main"

[tool.setuptools]
packages = ["youtube", "mcp_server"]
py-modules = ["cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
